<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111a5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="نادي الفضول">
  <link rel="manifest" href="manifest.webmanifest?v=7">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=7">
  <link rel="icon" type="image/png" href="apple-touch-icon.png?v=7">
  <title>نادي الفضول</title>
  <style>
    html,body{margin:0;min-height:100%;background:#111a5c;font-family:system-ui,sans-serif;color:#fff}
    body{display:grid;place-items:center}.loading{text-align:center;font-weight:900;padding:28px}.spin{font-size:62px;animation:b 1s ease-in-out infinite alternate}@keyframes b{to{transform:translateY(-9px)}}
  </style>
</head>
<body>
  <div class="loading" id="boot"><div class="spin">🧢👓</div><h2>نادي الفضول</h2><p>جاري تجهيز الألعاب…</p></div>
  <script>
  (async()=>{
    const cssFiles=['v5/css-01.txt','v5/css-02.txt','v5/compact.css'];
    const jsFiles=['v5/js-01.txt','v5/js-02.txt','v5/js-03.txt','v5/js-04.txt','v5/js-05.txt','v5/js-06.txt','v5/compact.js'];
    async function load(files){
      const out=[];
      for(const file of files){
        const r=await fetch(file+'?v=5.1.1',{cache:'no-store'});
        if(!r.ok) throw new Error('تعذر تحميل '+file+' ('+r.status+')');
        out.push(await r.text());
      }
      return out.join('');
    }
    const [css,js]=await Promise.all([load(cssFiles),load(jsFiles)]);
    if(css.length<12000||js.length<32000) throw new Error('ملفات اللعبة غير مكتملة');
    const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);
    document.body.innerHTML='<div id="app"></div><div id="toast" class="toast"></div>';
    const script=document.createElement('script');
    script.onerror=()=>{document.body.innerHTML='<div class="loading"><div class="spin">🛠️</div><h1>تعذر تشغيل اللعبة</h1><p>خطأ في ملفات اللعبة.</p></div>'};
    script.textContent=js;
    document.body.appendChild(script);
  })().catch(error=>{
    document.body.innerHTML='<div class="loading"><div class="spin">🛠️</div><h1>تعذر تشغيل اللعبة</h1><p>'+error.message+'</p><button onclick="location.reload()" style="font:inherit;font-weight:900;padding:12px 20px;border:0;border-radius:16px">إعادة المحاولة</button></div>';
    console.error(error);
  });
  </script>
</body>
</html>
